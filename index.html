<title>Control Hub</title>
<script>try{var t=localStorage.getItem('controlhub-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --page:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F8FA; --surface-3:#EAEFF3;
  --ink:#101820; --ink-2:#47545F; --ink-3:#78868F;
  --rule:#DCE3E9; --rule-strong:#C2CCD5;
  --brand-red:#C2000C; --brand-red-deep:#550E0B; --brand-red-soft:#FBEAEA;
  --blue-deep:#3C659B; --blue-mid:#6BAAC9; --blue-pale:#DCE8F1;
  --track:#E1E8EE;
  --masthead:#0E151B; --masthead-2:#182229; --masthead-ink:#E9EEF2; --masthead-ink-2:#8FA0AD;
  --sector-pessoal:#9A6B00; --sector-contabil:#0F7A55; --sector-fiscal:#6A4FA0; --sector-financeiro:#1D6FA5;
  --status-green:#167A45; --status-warn:#B5530C;
  --st-pend-bg:#E9EEF2; --st-pend-ink:#3F4B55;
  --shadow-1:0 1px 2px rgba(16,24,32,.05), 0 6px 16px rgba(16,24,32,.06);
  --shadow-2:0 2px 4px rgba(16,24,32,.08), 0 14px 32px rgba(16,24,32,.12);
  --r:4px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0B1015; --surface:#131A21; --surface-2:#182129; --surface-3:#1E2831;
    --ink:#E8EDF2; --ink-2:#AAB7C2; --ink-3:#7A8791;
    --rule:#242F39; --rule-strong:#35434E;
    --brand-red:#E8474B; --brand-red-deep:#8A1A18; --brand-red-soft:#2C1416;
    --blue-deep:#8CC6EC; --blue-mid:#4F8CB8; --blue-pale:#1B2B38;
    --track:#1F2A33;
    --masthead:#080D11; --masthead-2:#131C23; --masthead-ink:#E9EEF2; --masthead-ink-2:#8FA0AD;
    --sector-pessoal:#B98530; --sector-contabil:#33A67C; --sector-fiscal:#9478D6; --sector-financeiro:#5FA8E0;
    --status-green:#4ECC8B; --status-warn:#FF9D42;
    --st-pend-bg:#26313B; --st-pend-ink:#C3CDD5;
    --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    --shadow-2:0 2px 6px rgba(0,0,0,.35), 0 16px 36px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0B1015; --surface:#131A21; --surface-2:#182129; --surface-3:#1E2831;
  --ink:#E8EDF2; --ink-2:#AAB7C2; --ink-3:#7A8791;
  --rule:#242F39; --rule-strong:#35434E;
  --brand-red:#E8474B; --brand-red-deep:#8A1A18; --brand-red-soft:#2C1416;
  --blue-deep:#8CC6EC; --blue-mid:#4F8CB8; --blue-pale:#1B2B38;
  --track:#1F2A33;
  --masthead:#080D11; --masthead-2:#131C23; --masthead-ink:#E9EEF2; --masthead-ink-2:#8FA0AD;
  --sector-pessoal:#B98530; --sector-contabil:#33A67C; --sector-fiscal:#9478D6; --sector-financeiro:#5FA8E0;
  --status-green:#4ECC8B; --status-warn:#FF9D42;
  --st-pend-bg:#26313B; --st-pend-ink:#C3CDD5;
  --shadow-1:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  --shadow-2:0 2px 6px rgba(0,0,0,.35), 0 16px 36px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{background:var(--page); color:var(--ink); font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:13.5px; line-height:1.5;}
h1,h2,h3,h4{font-family:"Archivo",system-ui,sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em;}
button,input,select,textarea{font-family:inherit; color:inherit;}
input,select,textarea{font-size:13px; background:var(--surface); border:1px solid var(--rule-strong); border-radius:var(--r); padding:7px 9px; outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--blue-deep); box-shadow:0 0 0 3px var(--blue-pale);}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
::selection{background:var(--brand-red); color:#fff;}
a{color:var(--blue-deep);}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important; transition-duration:.001ms!important;} }

.wrap{max-width:1180px; margin:0 auto; padding-inline:22px;}

/* ============ masthead ============ */
.masthead{background:var(--masthead); border-bottom:3px solid var(--brand-red); position:sticky; top:env(safe-area-inset-top,0px); z-index:30;}
.masthead-top{display:flex; align-items:center; justify-content:space-between; gap:14px; padding-block:12px 10px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-ico{font-size:24px; line-height:1;}
.wordmark{font-family:"Archivo",sans-serif; font-weight:700; font-size:19px; letter-spacing:-.02em; line-height:1;}
.wm-a{color:var(--brand-red);} .wm-b{color:#7FC2DE;}
.brand-tag{font-size:11.5px; font-weight:500; color:var(--masthead-ink-2); margin-top:3px; display:flex; align-items:center; gap:6px;}
.brand-tag i{width:4px; height:4px; border-radius:50%; background:var(--brand-red); display:block;}
.masthead-bar{display:flex; align-items:center; gap:16px; flex-wrap:wrap; border-top:1px solid var(--masthead-2);}
.navtabs{display:flex; flex-wrap:wrap; overflow-x:auto; scrollbar-width:none;}
.navtabs::-webkit-scrollbar{display:none;}
.navtabs button{background:none; border:none; border-bottom:3px solid transparent; padding:11px 2px; margin-right:20px; color:var(--masthead-ink-2); font-size:13.5px; font-weight:600; cursor:pointer; font-family:"Archivo",sans-serif; white-space:nowrap;}
.navtabs button:hover{color:var(--masthead-ink);}
.navtabs button.active{color:#fff; border-bottom-color:var(--brand-red);}
.mh-actions{margin-left:auto; display:flex; align-items:center; gap:8px; padding-block:8px; flex-wrap:wrap;}
.mh-search{position:relative;}
.mh-search input{background:var(--masthead-2); border:1px solid transparent; color:var(--masthead-ink); width:220px; max-width:44vw; font-size:13px; padding:6px 10px;}
.mh-search input::placeholder{color:#697A87;}
.mh-search input:focus{border-color:var(--brand-red); box-shadow:none;}
.theme-btn{flex:none; width:30px; height:30px; border-radius:var(--r); background:none; border:1px solid transparent; color:var(--masthead-ink-2); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px;}
.theme-btn:hover{border-color:#2A3740; color:var(--masthead-ink);}
@media (max-width:760px){
  .masthead-top{padding-block:9px 7px;}
  .brand-tag{display:none;}
  .wordmark{font-size:17px;}
  .mh-search input{width:150px;}
}

/* ============ layout / typography helpers ============ */
main{padding-block:24px 90px; display:flex; flex-direction:column; gap:24px;}
.view{display:flex; flex-direction:column; gap:22px; animation:rise .22s ease;}
@keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
.sec-label{font-family:"Archivo",sans-serif; font-size:16px; font-weight:700; letter-spacing:-.01em; display:flex; align-items:baseline; gap:10px; margin-bottom:12px;}
.sec-label .cnt{margin-left:auto; font-size:13px; font-weight:500; color:var(--ink-3);}
.sec-sub{font-size:12.5px; color:var(--ink-3); margin-top:-14px;}
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); box-shadow:var(--shadow-1);}
.panel-pad{padding:18px 20px;}
.toolbar{display:flex; align-items:center; gap:10px 12px; flex-wrap:wrap; padding:14px 20px; border-bottom:1px solid var(--rule);}
.toolbar h2{font-size:14.5px; font-weight:700; margin-right:auto;}
.toolbar .grow{flex:1 1 auto; min-width:160px;}

/* ============ buttons / chips ============ */
.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--rule-strong); background:var(--surface); color:var(--ink-2); border-radius:var(--r); padding:8px 13px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; text-decoration:none; transition:border-color .15s, background .15s, color .15s;}
.btn:hover{border-color:var(--blue-deep); color:var(--blue-deep);}
.btn:disabled{opacity:.5; cursor:default;}
.btn-primary{background:var(--blue-deep); border-color:var(--blue-deep); color:#fff;}
.btn-primary:hover{filter:brightness(1.06); color:#fff;}
:root[data-theme="dark"] .btn-primary, :root:not([data-theme="light"]) .btn-primary{color:#0B1015;}
.btn-danger{background:var(--brand-red); border-color:var(--brand-red); color:#fff;}
.btn-danger:hover{filter:brightness(1.06); color:#fff;}
.btn-ghost{background:none;}
.btn-sm{padding:5px 10px; font-size:11.5px;}
.icon-btn{border:0; background:none; cursor:pointer; padding:6px; border-radius:var(--r); font-size:15px; line-height:1; color:var(--ink-3);}
.icon-btn:hover{background:var(--surface-2); color:var(--ink);}
.btn:focus-visible,.icon-btn:focus-visible,.navtabs button:focus-visible,.filters button:focus-visible{outline:2px solid var(--blue-deep); outline-offset:2px;}

.filters{display:inline-flex; border:1px solid var(--rule-strong); border-radius:var(--r); overflow:hidden;}
.filters button{background:var(--surface); border:none; border-left:1px solid var(--rule); padding:7px 12px; font-size:11.5px; font-weight:600; color:var(--ink-3); cursor:pointer; white-space:nowrap;}
.filters button:first-child{border-left:none;}
.filters button.on{background:var(--ink); color:var(--page);}

/* ============ dialogs ============ */
dialog.dlg{border:1px solid var(--rule); border-radius:8px; padding:0; background:var(--surface); color:var(--ink); box-shadow:0 20px 60px rgba(0,0,0,.3); width:min(600px, calc(100vw - 32px));}
dialog.dlg.dlg-lg{width:min(820px, calc(100vw - 32px));}
dialog.dlg::backdrop{background:rgba(10,15,20,.55); backdrop-filter:blur(2px);}
.dlg-head{display:flex; align-items:center; gap:10px; padding:18px 22px 0;}
.dlg-head h2{font-size:17px; font-weight:700; margin-right:auto;}
.dlg-body{padding:16px 22px 22px; display:flex; flex-direction:column; gap:16px; max-height:78vh; overflow-y:auto;}
.dlg-actions{display:flex; gap:8px; justify-content:flex-end; padding-top:6px; border-top:1px solid var(--rule); margin-top:4px;}
.field{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--ink-3); font-weight:600;}
.field input,.field select,.field textarea{font-weight:400; color:var(--ink); width:100%;}
.field textarea{resize:vertical;}
.form-row{display:flex; gap:12px; flex-wrap:wrap;}
.form-row > *{flex:1; min-width:140px;}
.dlg-close{margin-left:auto;}

/* ============ ferramentas ============ */
.tools{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px; padding:16px 20px;}
.tools.list{display:flex; flex-direction:column; gap:8px;}
.card{position:relative; background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); box-shadow:var(--shadow-1); padding:14px; display:flex; flex-direction:column; gap:9px; border-top:3px solid var(--accent, var(--blue-deep));}
.card.dragging{opacity:.4;}
.card.drag-over{outline:2px dashed var(--blue-deep); outline-offset:2px;}
.card-head{display:flex; align-items:center; gap:10px;}
.card-icon{width:38px; height:38px; display:grid; place-items:center; font-size:20px; border-radius:var(--r); background:color-mix(in srgb, var(--accent, var(--blue-deep)) 16%, transparent); flex:none;}
.card-title{font-weight:600; font-size:14.5px; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.card-host{color:var(--ink-3); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.card-titles{min-width:0; flex:1;}
.card-desc{color:var(--ink-2); font-size:12.5px; margin:0; min-height:1.2em;}
.card-tags{display:flex; flex-wrap:wrap; gap:5px;}
.tag{font-size:10.5px; padding:2px 7px; border-radius:99px; background:var(--surface-2); color:var(--ink-3);}
.card-foot{display:flex; align-items:center; gap:5px; margin-top:auto;}
.card-meta{color:var(--ink-3); font-size:11px; margin-right:auto;}
.fav-btn{opacity:.35;} .fav-btn.on{opacity:1;}
.status{display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-3);}
.status-dot{width:8px; height:8px; border-radius:50%; background:var(--rule-strong);}
.status.online .status-dot{background:var(--status-green);}
.status.offline .status-dot{background:var(--brand-red);}
.status.checking .status-dot{background:var(--status-warn); animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.tools.list .card{flex-direction:row; align-items:center; border-top:1px solid var(--rule); border-left:3px solid var(--accent,var(--blue-deep));}
.tools.list .card-head{flex:0 0 240px;}
.tools.list .card-desc{flex:1;}
.tools.list .card-tags{display:none;}
.card.no-link .card-host{font-style:italic; color:var(--status-warn);}
.empty{text-align:center; padding:56px 20px; color:var(--ink-3);}
.empty-icon{font-size:44px; margin:0;}

.toast{position:fixed; bottom:20px; left:50%; transform:translate(-50%,20px); background:var(--ink); color:var(--page); padding:10px 16px; border-radius:var(--r); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; font-size:13px;}
.toast.show{opacity:1; transform:translate(-50%,0);}
.spacer{flex:1;}

@media (max-width:640px){
  .wrap{padding-inline:16px;}
  main{padding-block:18px 70px;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
}
</style>

<header class="masthead">
  <div class="wrap">
    <div class="masthead-top">
      <div class="brand">
        <span class="brand-ico">🎛️</span>
        <div>
          <div class="wordmark"><span class="wm-a">Control</span><span class="wm-b">Hub</span></div>
          <div class="brand-tag"><i></i>Painel interno · ControlTax</div>
        </div>
      </div>
    </div>
    <div class="masthead-bar">
      <nav class="navtabs" id="navtabs">
        <button type="button" data-view="ferramentas" class="active">Ferramentas</button>
      </nav>
      <div class="mh-actions">
        <div class="mh-search"><input type="search" id="global-search" placeholder="Buscar…" autocomplete="off"></div>
        <button type="button" class="theme-btn" id="btn-theme" title="Alternar tema" aria-label="Alternar tema">🌓</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap"><main id="main">

  <!-- ================= FERRAMENTAS ================= -->
  <section class="view" id="view-ferramentas">
    <div class="panel">
      <div class="toolbar">
        <h2>Ferramentas</h2>
        <div class="filters" id="ferramentas-view-filtro">

</main></div>

<!-- ===== dialog: ferramenta ===== -->
<dialog id="dlg-ferramenta" class="dlg">
  <div class="dlg-head"><h2 id="dlg-ferramenta-title">Nova ferramenta</h2><button type="button" class="icon-btn dlg-close" id="dlg-ferramenta-close-x" aria-label="Fechar">✕</button></div>

      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px"><input type="checkbox" name="monitor" checked> Monitorar status</label>
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px"><input type="checkbox" name="newTab" checked> Nova aba</label>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn btn-danger" id="btn-ferramenta-excluir" hidden>Excluir</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="btn-ferramenta-cancelar">Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</dialog>

<!-- ===== confirmação genérica ===== -->
<dialog id="dlg-ask" class="dlg" style="width:min(420px, calc(100vw - 32px))">
  <div class="dlg-body">
    <p id="ask-message" style="margin:0; white-space:pre-line; font-size:14px; line-height:1.5"></p>
    <div class="dlg-actions" id="ask-actions"></div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const HOSTED = typeof window.claude?.use === 'function';
  const THEME_KEY = 'controlhub-theme';
  const PREFS_KEY = 'controlhub-prefs';
  const STATUS_TIMEOUT_MS = 8000;
  const RECENT_LIMIT = 12;

  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const escapeHtml = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const validId = (id) => typeof id === 'string' && /^[A-Za-z0-9_\-.~:@+]{1,120}$/.test(id) && id !== '.' && id !== '..';

  function safeUrl(url) {
    try { const u = new URL(url); return ['http:','https:'].includes(u.protocol) ? u.href : null; }
    catch { return null; }
  }
  function hostOf(url) {
    if (!url) return 'Link não configurado';
    try { return new URL(url).host; } catch { return url; }
  }
  let toastTimer;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  function ask(message, buttons) {
    const dlg = $('#dlg-ask');
    $('#ask-message').textContent = message;
    const actions = $('#ask-actions');
    actions.innerHTML = '<span class="spacer"></span>' + buttons.map((b,i) =>
      `<button type="button" class="btn ${b.kind||''}" data-i="${i}">${escapeHtml(b.label)}</button>`).join('');
    return new Promise((resolve) => {
      const done = (value) => { dlg.removeEventListener('close', onClose); actions.onclick = null; if (dlg.open) dlg.close(); resolve(value); };
      const onClose = () => done(null);
      actions.onclick = (e) => { const btn = e.target.closest('[data-i]'); if (btn) done(buttons[btn.dataset.i].value); };
      dlg.addEventListener('close', onClose);
      dlg.showModal();
    });
  }

  // ---------- estado ----------
  const state = {
    view: 'ferramentas',
    tools: [], toolsLoaded: false,
    status: {},
    readOnly: false,
    canCheck: !HOSTED,
    toolsView: 'all', toolsQuery: '',
    prefs: { theme: null, toolsLayout: 'grid', toolsSort: 'manual' },
  };

  let db = null, downloads = null;

  function loadPrefs() { try { Object.assign(state.prefs, JSON.parse(localStorage.getItem(PREFS_KEY)||'{}')); } catch {} }
  function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(state.prefs)); } catch {} }
  const systemDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;
  function currentTheme() { return document.documentElement.dataset.theme || state.prefs.theme || (systemDark() ? 'dark' : 'light'); }
  function applyTheme() { if (state.prefs.theme) document.documentElement.dataset.theme = state.prefs.theme; try { localStorage.setItem(THEME_KEY, state.prefs.theme || ''); } catch {} }

  // ---------- normalização: ferramentas ----------
  const DEFAULT_TOOLS = [
    { id:'gestta', name:'Gestta', url:'https://app.gestta.com.br', icon:'📈', category:'Acompanhamento', color:'#0F7A55', description:'Andamento das empresas.', tags:['empresas'] },
    { id:'portal-cliente', name:'Portal do Cliente', url:'', icon:'🧑‍💼', category:'Atalhos', color:'#3C659B', description:'Acesso rápido pelo app.', tags:['cliente'] },
    { id:'planilha-dp', name:'Planilha DP', url:'', icon:'👥', category:'Atalhos', color:'#3C659B', description:'Acesso rápido pelo app.', tags:['planilha','dp'] },
    { id:'planilha-fiscal', name:'Planilha Fiscal', url:'', icon:'🧾', category:'Atalhos', color:'#3C659B', description:'Acesso rápido pelo app.', tags:['planilha','fiscal'] },
    { id:'planilha-contabil', name:'Planilha Contábil', url:'', icon:'📒', category:'Atalhos', color:'#3C659B', description:'Acesso rápido pelo app.', tags:['planilha','contábil'] },
    { id:'zappy', name:'Zappy', url:'', icon:'💬', category:'Comunicação', color:'#167A45', description:'Só os contatos.', tags:['whatsapp','contatos'] },
    { id:'zimbra', name:'Zimbra', url:'', icon:'✉️', category:'Comunicação', color:'#167A45', description:'Agendamento das salas e monitoramento das comunicações.', tags:['e-mail','salas'] },
    { id:'pasta-servidor', name:'Pasta Servidor', url:'', icon:'🗄️', category:'Monitoramento', color:'#B5530C', description:'Arquivos fora do padrão ou salvos no local errado.', tags:['servidor','arquivos'], monitor:false },
  ];

  function normalizeTool(t, i=0) {
    return {
      id: validId(t.id) ? t.id : uid(),
      name: String(t.name || 'Sem nome').slice(0,60),
      url: safeUrl(t.url) || '',
      icon: t.icon || '🔧',
      category: String(t.category || 'Geral').trim() || 'Geral',
      color: /^#[0-9a-f]{6}$/i.test(t.color||'') ? t.color : '#3C659B',
      description: t.description || '',
      tags: Array.isArray(t.tags) ? t.tags.filter(Boolean).map(String) : [],
      notes: t.notes || '',
      favorite: !!t.favorite,
      monitor: t.monitor !== false,
      newTab: t.newTab !== false,
      order: Number.isFinite(t.order) ? t.order : i,
      uses: Number(t.uses) || 0,
      lastUsed: t.lastUsed || null,
      createdAt: t.createdAt || Date.now(),
    };
  }

  // ---------- persistência (genérica por coleção) ----------
  function makeLocalStore(key, defaultsFn) {
    return {
      shared:false,
      load() { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : defaultsFn(); } catch { return defaultsFn(); } },
      persistAll(list) { try { localStorage.setItem(key, JSON.stringify(list)); } catch { toast('Não foi possível salvar no navegador.'); } },
      async saveOne(list) { this.persistAll(list); },
      async saveMany(list) { this.persistAll(list); },
      async deleteOne(list) { this.persistAll(list); },
    };
  }
  function makeDbStore(collection) {
    return {
      shared:true,
      async saveOne(item) { const { id, ...body } = item; await db.doc(`${collection}/${id}`).set(body); },
      async saveMany(list) { for (const item of list) await this.saveOne(item); },
      async deleteOne(id) { await db.doc(`${collection}/${id}`).delete(); },
    };
  }

  let toolsStore = makeLocalStore('control-hub:v1', () => DEFAULT_TOOLS);
  const toolsDbStore = makeDbStore('tools');

  async function persist(fn) {
    try { await fn(); }
    catch (e) {
      if (e?.code === 'invalid_argument') { state.readOnly = true; toast('Você não tem permissão para editar esta lista.'); render(); }
      else if (e?.code === 'quota_exceeded') toast('Limite atingido. Exclua algo para adicionar mais.');
      else toast('Não foi possível salvar. Tente de novo em instantes.');
    }
  }

  // ---------- consultas: ferramentas ----------
  const categories = () => [...new Set(state.tools.map(t => t.category))].sort((a,b) => a.localeCompare(b,'pt-BR'));
  function matchesToolQuery(t,q) {
    if (!q) return true;
    const hay = [t.name,t.description,t.category,t.url,t.notes,...t.tags].join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
  }
  function inToolView(t, view) {
    if (view === 'favorites') return t.favorite;
    if (view === 'recent') return !!t.lastUsed;
    if (view === 'offline') return state.status[t.id] === 'offline';
    if (view.startsWith('cat:')) return t.category === view.slice(4);
    return true;
  }
  function visibleTools() {
    let list = state.tools.filter(t => inToolView(t, state.toolsView) && matchesToolQuery(t, state.toolsQuery));
    const sort = state.toolsView === 'recent' ? 'recent' : state.prefs.toolsSort;
    const by = {
      manual:(a,b)=>a.order-b.order,
      name:(a,b)=>a.name.localeCompare(b.name,'pt-BR'),
      usage:(a,b)=>b.uses-a.uses||a.order-b.order,
      recent:(a,b)=>(b.lastUsed||0)-(a.lastUsed||0),
    }[sort];
    list.sort(by);
    if (state.toolsView === 'recent') list = list.slice(0, RECENT_LIMIT);
    if (state.toolsView === 'all' && sort === 'manual') list.sort((a,b) => b.favorite - a.favorite);
    return list;
  }

  // ---------- render: shell ----------
  function render() {
    renderFerramentas();
  }

  // ---------- render: ferramentas ----------
  function renderFerramentas() {
    $('#ferramentas-offline-btn').hidden = !state.canCheck;
    $('#ferramentas-btn-check').hidden = !state.canCheck;
    $('#btn-ferramenta-nova').hidden = state.readOnly;
    $$('#ferramentas-view-filtro button').forEach(b => b.classList.toggle('on', b.dataset.fview === state.toolsView));
    $('#ferramentas-sort').value = state.prefs.toolsSort;

    const cats = categories();
    $('#ferramentas-cats').innerHTML = cats.length ? cats.map(c => `<button type="button" class="btn btn-sm" data-cat="${escapeHtml(c)}">${escapeHtml(c)} <span class="mono">${state.tools.filter(t=>t.category===c).length}</span></button>`).join('') : '';
    $$('#ferramentas-cats [data-cat]').forEach(b => b.addEventListener('click', () => { state.toolsView = 'cat:'+b.dataset.cat; renderFerramentas(); }));

    const list = visibleTools();
    const container = $('#ferramentas-tools');
    container.className = `tools ${state.prefs.toolsLayout}`;
    $('#ferramentas-btn-layout').textContent = state.prefs.toolsLayout === 'grid' ? '☰' : '▦';

    if (!state.toolsLoaded) { container.innerHTML = ''; $('#ferramentas-empty').hidden = true; return; }
    $('#ferramentas-empty').hidden = list.length > 0;

    const draggable = !state.readOnly && state.prefs.toolsSort === 'manual' && state.toolsView !== 'recent' && !state.toolsQuery;
    const ro = state.readOnly;
    const STATUS_LABEL = { online:'Online', offline:'Fora do ar', checking:'Verificando…' };

    container.innerHTML = list.map(t => {
      const st = state.canCheck && t.monitor && t.url ? state.status[t.id] : null;
      const used = t.lastUsed ? `Usada há pouco` : 'Nunca usada';
      const target = t.newTab || HOSTED ? ' target="_blank" rel="noopener noreferrer"' : '';
      return `
      <article class="card${t.url?'':' no-link'}" data-id="${escapeHtml(t.id)}" style="--accent:${t.color}" ${draggable?'draggable="true"':''}>
        <div class="card-head">
          <div class="card-icon">${escapeHtml(t.icon)}</div>
          <div class="card-titles"><h3 class="card-title" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</h3><div class="card-host">${escapeHtml(hostOf(t.url))}</div></div>
          <button class="icon-btn fav-btn ${t.favorite?'on':''}" data-action="fav" aria-label="Favoritar" ${ro?'disabled':''}>⭐</button>
        </div>
        <p class="card-desc">${escapeHtml(t.description)}</p>
        ${t.tags.length ? `<div class="card-tags">${t.tags.map(g=>`<span class="tag">${escapeHtml(g)}</span>`).join('')}</div>` : ''}
        <div class="card-foot">
          ${st ? `<span class="status ${st}"><span class="status-dot"></span>${STATUS_LABEL[st]}</span>` : `<span class="card-meta">${used}</span>`}
          ${state.canCheck && t.monitor && t.url ? `<button class="icon-btn" data-action="check" aria-label="Verificar status">📡</button>` : ''}
          ${t.url ? `<button class="icon-btn" data-action="copy" aria-label="Copiar link">🔗</button>` : ''}
          ${ro ? '' : `<button class="icon-btn" data-action="edit" aria-label="Editar">✏️</button>`}
          ${t.url ? `<a class="btn btn-primary btn-sm" data-action="open" href="${escapeHtml(t.url)}"${target}>Abrir ↗</a>` : (ro ? '' : `<button class="btn btn-sm" data-action="edit">Definir link</button>`)}
        </div>
      </article>`;
    }).join('');
  }

  const findTool = (id) => state.tools.find(t => t.id === id);

  function recordUse(t) { t.uses += 1; t.lastUsed = Date.now(); if (!state.readOnly) persist(() => toolsStore.saveOne(t)); }

  async function checkStatus(t) {
    if (!t.url || !state.canCheck) return;
    state.status[t.id] = 'checking'; renderFerramentas();
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), STATUS_TIMEOUT_MS);
    try { await fetch(t.url, { mode:'no-cors', cache:'no-store', signal:ctrl.signal }); state.status[t.id] = 'online'; }
    catch { state.status[t.id] = 'offline'; }
    finally { clearTimeout(timer); }
    renderFerramentas();
  }
  async function checkAll() {
    const btn = $('#ferramentas-btn-check'); btn.disabled = true;
    const monitored = state.tools.filter(t => t.monitor && t.url);
    await Promise.all(monitored.map(checkStatus));
    btn.disabled = false;
    const off = monitored.filter(t => state.status[t.id] === 'offline').length;
    toast(off ? `${off} ferramenta(s) com problema.` : 'Tudo online ✅');
  }
  async function copyLink(t) {
    if (!t.url) return toast('Link não configurado.');
    try { await navigator.clipboard.writeText(t.url); toast('Link copiado.'); } catch { toast(t.url); }
  }

  const dlgFerramenta = $('#dlg-ferramenta');
  const formFerramenta = $('#form-ferramenta');
  function openFerramentaDialog(tool) {
    if (state.readOnly) return;
    formFerramenta.reset();
    $('#dlg-ferramenta-title').textContent = tool ? 'Editar ferramenta' : 'Nova ferramenta';
    $('#btn-ferramenta-excluir').hidden = !tool;
    const t = tool || { icon:'🔧', color:'#3C659B', monitor:true, newTab:true, category: state.toolsView.startsWith('cat:') ? state.toolsView.slice(4) : '' };
    const f = formFerramenta.elements;
    f.id.value = t.id||''; f.name.value = t.name||''; f.url.value = t.url||''; f.icon.value = t.icon||''; f.description.value = t.description||'';
    f.category.value = t.category||''; f.color.value = t.color||'#3C659B'; f.tags.value = (t.tags||[]).join(', '); f.notes.value = t.notes||'';
    f.favorite.checked = !!t.favorite; f.monitor.checked = t.monitor !== false; f.newTab.checked = t.newTab !== false;
    $('#ferramenta-cat-options').innerHTML = categories().map(c => `<option value="${escapeHtml(c)}">`).join('');
    dlgFerramenta.showModal(); f.name.focus();
  }
  formFerramenta.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = formFerramenta.elements;
    const rawUrl = f.url.value.trim();
    const url = rawUrl ? safeUrl(rawUrl) : '';
    if (url === null) { toast('Informe uma URL http(s) válida.'); f.url.focus(); return; }
    const data = { name:f.name.value.trim(), url, icon:f.icon.value.trim()||'🔧', description:f.description.value.trim(), category:f.category.value.trim()||'Geral', color:f.color.value, tags:f.tags.value.split(',').map(s=>s.trim()).filter(Boolean), notes:f.notes.value.trim(), favorite:f.favorite.checked, monitor:f.monitor.checked, newTab:f.newTab.checked };
    let tool = findTool(f.id.value);
    if (tool) { Object.assign(tool, data); toast('Ferramenta atualizada.'); }
    else { const order = Math.max(-1, ...state.tools.map(t=>t.order)) + 1; tool = normalizeTool({...data, order}); state.tools.push(tool); toast('Ferramenta adicionada.'); }
    persist(() => toolsStore.saveOne(tool));
    dlgFerramenta.close();
    renderFerramentas();
  });
  $('#btn-ferramenta-cancelar').addEventListener('click', () => dlgFerramenta.close());
  $('#dlg-ferramenta-close-x').addEventListener('click', () => dlgFerramenta.close());
  $('#btn-ferramenta-excluir').addEventListener('click', async () => {
    const t = findTool(formFerramenta.elements.id.value);
    if (!t) return;
    dlgFerramenta.close();
    const ok = await ask(`Excluir "${t.name}"?`, [{label:'Cancelar',value:false},{label:'Excluir',value:true,kind:'btn-danger'}]);
    if (!ok) return;
    state.tools = state.tools.filter(x => x.id !== t.id);
    delete state.status[t.id];
    persist(() => toolsStore.deleteOne(t.id));
    if (state.toolsView.startsWith('cat:') && !categories().includes(state.toolsView.slice(4))) state.toolsView = 'all';
    renderFerramentas();
    toast('Ferramenta excluída.');
  });
  $('#btn-ferramenta-nova').addEventListener('click', () => openFerramentaDialog(null));

  $('#ferramentas-tools').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]'); const card = e.target.closest('.card');
    if (!card || !btn) return;
    const t = findTool(card.dataset.id); if (!t) return;
    const action = btn.dataset.action;
    if (action === 'open') recordUse(t);
    else if (action === 'edit') openFerramentaDialog(t);
    else if (action === 'copy') copyLink(t);
    else if (action === 'check') checkStatus(t);
    else if (action === 'fav' && !state.readOnly) { t.favorite = !t.favorite; persist(() => toolsStore.saveOne(t)); renderFerramentas(); }
  });

  let dragId = null;
  $('#ferramentas-tools').addEventListener('dragstart', (e) => { const card = e.target.closest('.card'); if (!card) return; dragId = card.dataset.id; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
  $('#ferramentas-tools').addEventListener('dragend', (e) => { e.target.closest('.card')?.classList.remove('dragging'); $$('.drag-over').forEach(el => el.classList.remove('drag-over')); });
  $('#ferramentas-tools').addEventListener('dragover', (e) => { const card = e.target.closest('.card'); if (!card || !dragId) return; e.preventDefault(); $$('.drag-over').forEach(el => el.classList.remove('drag-over')); if (card.dataset.id !== dragId) card.classList.add('drag-over'); });
  $('#ferramentas-tools').addEventListener('drop', (e) => {
    const card = e.target.closest('.card'); if (!card || !dragId || card.dataset.id === dragId) return;
    e.preventDefault();
    const ordered = [...state.tools].sort((a,b) => a.order-b.order);
    const from = ordered.findIndex(t => t.id === dragId); const to = ordered.findIndex(t => t.id === card.dataset.id);
    const [moved] = ordered.splice(from,1); ordered.splice(to,0,moved);
    const changed = ordered.filter((t,i) => t.order !== i);
    ordered.forEach((t,i) => { t.order = i; });
    dragId = null;
    persist(() => toolsStore.saveMany(changed));
    renderFerramentas();
  });

  $('#ferramentas-view-filtro').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; state.toolsView = b.dataset.fview; renderFerramentas(); });
  $('#ferramentas-sort').addEventListener('change', (e) => { state.prefs.toolsSort = e.target.value; savePrefs(); renderFerramentas(); });
  $('#ferramentas-btn-layout').addEventListener('click', () => { state.prefs.toolsLayout = state.prefs.toolsLayout === 'grid' ? 'list' : 'grid'; savePrefs(); renderFerramentas(); });
  $('#ferramentas-btn-check').addEventListener('click', checkAll);
  $('#ferramentas-btn-export').addEventListener('click', async () => {
    const filename = `control-hub-${new Date().toISOString().slice(0,10)}.json`;
    const json = JSON.stringify({ app:'control-hub', version:1, exportedAt:new Date().toISOString(), tools: state.tools }, null, 2);
    if (downloads) { try { await downloads.save({ filename, data: json }); } catch (e) { if (e?.code !== 'declined') toast('Não foi possível gerar o arquivo aqui.'); } return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download = filename; a.click(); URL.revokeObjectURL(a.href);
  });
  $('#ferramentas-import-input').addEventListener('change', async (e) => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    let tools;
    try { const json = JSON.parse(await file.text()); tools = Array.isArray(json) ? json : json.tools; if (!Array.isArray(tools)) throw new Error(); }
    catch { toast('Arquivo inválido: use um JSON exportado pelo Control Hub.'); return; }
    const mode = await ask(`Importar ${tools.length} ferramenta(s).\nSubstituir a lista atual ou juntar com ela?`, [{label:'Cancelar',value:null},{label:'Juntar',value:'merge'},{label:'Substituir',value:'replace',kind:'btn-danger'}]);
    if (!mode) return;
    const incoming = tools.map(normalizeTool);
    let removed = [];
    if (mode === 'replace') { const keep = new Set(incoming.map(t=>t.id)); removed = state.tools.filter(t=>!keep.has(t.id)).map(t=>t.id); state.tools = incoming; }
    else { const ids = new Set(state.tools.map(t=>t.id)); const base = Math.max(-1, ...state.tools.map(t=>t.order))+1; incoming.forEach((t,i) => { if (ids.has(t.id)) t.id = uid(); t.order = base+i; state.tools.push(t); }); }
    state.status = {};
    renderFerramentas();
    await persist(async () => { await toolsStore.saveMany(incoming); for (const id of removed) await toolsStore.deleteOne(id); });
    toast(`${incoming.length} ferramenta(s) importada(s).`);
  });
  $('#ferramentas-btn-reset').addEventListener('click', async () => {
    const ok = await ask('Restaurar as ferramentas iniciais? As ferramentas atuais serão substituídas.', [{label:'Cancelar',value:false},{label:'Restaurar',value:true,kind:'btn-danger'}]);
    if (!ok) return;
    state.tools = DEFAULT_TOOLS.map(normalizeTool);
    state.status = {}; state.toolsView = 'all';
    toolsStore.persistAll(state.tools);
    renderFerramentas();
  });

  // ---------- navegação / busca global / tema ----------
  $('#global-search').addEventListener('input', (e) => { state.toolsQuery = e.target.value.trim(); renderFerramentas(); });
  $('#btn-theme').addEventListener('click', () => { state.prefs.theme = currentTheme() === 'dark' ? 'light' : 'dark'; applyTheme(); savePrefs(); });

  // ---------- inicialização ----------
  function startLocal() {
    toolsStore = makeLocalStore('control-hub:v1', () => DEFAULT_TOOLS);
    state.tools = toolsStore.load().map(normalizeTool);
    state.toolsLoaded = true;
    render();
  }

  async function startShared() {
    render();
    const [dbNs, dl, user] = await Promise.all([window.claude.use('db'), window.claude.use('downloads'), window.claude.use('user')]);
    downloads = dl;
    if (!dbNs) { state.canCheck = false; startLocal(); return; }
    db = dbNs;
    toolsStore = toolsDbStore;
    if (user && (await user.can('data.write').catch(() => null)) === false) state.readOnly = true;

    db.collection('tools').onSnapshot((snap) => {
      state.tools = snap.docs.map((d,i) => normalizeTool({ ...d.data(), id:d.id }, i));
      state.toolsLoaded = true;
      render();
    }, () => toast('A conexão com os dados caiu. Recarregue a página.'));
  }

  loadPrefs();
  applyTheme();
  if (HOSTED) startShared(); else startLocal();
})();
</script>
